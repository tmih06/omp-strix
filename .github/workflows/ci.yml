name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  pack:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Pack tarball
        run: mkdir -p dist && npm pack --pack-destination dist

      - name: Assert prod-only contents
        run: |
          set -euo pipefail
          files=$(tar -tzf dist/*.tgz)
          echo "$files"
          # Must ship the plugin payload
          echo "$files" | grep -q 'package/src/index.ts'
          echo "$files" | grep -q 'package/plugin.json'
          echo "$files" | grep -q 'package/sandbox/Dockerfile'
          # Must NOT ship dev files
          for banned in 'package/test/' 'package/.github/' 'package/node_modules/' 'package/tsconfig.json' 'package/biome.json' 'package/RESEARCH.md' 'package/package-lock.json' 'package/bun.lock'; do
            if echo "$files" | grep -q "$banned"; then
              echo "::error::tarball contains dev file: $banned"
              exit 1
            fi
          done

      - name: Smoke-import the packed entry
        run: |
          set -euo pipefail
          mkdir -p /tmp/pkg && tar -xzf dist/*.tgz -C /tmp/pkg
          cd /tmp/pkg/package
          bun -e 'await import("./src/index.ts"); console.log("entry imports cleanly")'

      - uses: actions/upload-artifact@v4
        with:
          name: omp-strix-tarball
          path: dist/*.tgz

  sandbox-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build sandbox image (amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          platforms: linux/amd64
          load: true
          tags: omp-strix-sandbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test tools
        run: |
          docker run --rm omp-strix-sandbox:ci sh -c '
            set -e
            for t in nmap masscan rustscan sqlmap dirsearch gobuster ffuf nikto hydra john hashcat \
                     httpx wafw00f arjun uro nuclei subfinder katana naabu dnsx uncover amass \
                     interactsh-client semgrep sg ast-grep trivy gitleaks trufflehog hurl \
                     nxc enum4linux-ng smbmap jwt_tool paramspider dalfox feroxbuster kxss \
                     gau waybackurls anew qsreplace unfurl hakrawler assetfinder x8 \
                     prowler checkov wpscan r2 binwalk onesixtyone arp-scan nbtscan \
                     python3 pip3 git jq curl wget openssl socat; do
              command -v $t >/dev/null || { echo "MISSING: $t"; exit 1; }
            done
            command -v secretsdump.py >/dev/null || command -v impacket-secretsdump >/dev/null \
              || { echo "MISSING: impacket scripts"; exit 1; }
            ls /opt/wordlists/common.txt /opt/wordlists/raft-small-directories.txt \
               /opt/wordlists/raft-small-words.txt /opt/wordlists/subdomains-top1million-5000.txt >/dev/null \
              || { echo "MISSING: wordlists"; exit 1; }
            echo "all tools present"'
