name: sandbox-image

on:
  push:
    branches: [main, master]
    paths: ["sandbox/**", ".github/workflows/sandbox-image.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (e.g. 1.0.0)"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: sandbox-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/omp-strix-sandbox

jobs:
  # Each arch builds natively in parallel — amd64 on x86, arm64 on the
  # ARM64 runner (free for public repos). No QEMU emulation.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            os: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:tmp-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # Gate: runs only when EVERY matrix leg succeeded. Merges the per-arch
  # images into the real multi-arch tags, then removes the temp tags.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=short

      - name: Merge per-arch images into multi-arch manifest
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r t; do
            [ -n "$t" ] && args+=(-t "$t")
          done <<< '${{ steps.meta.outputs.tags }}'
          docker buildx imagetools create "${args[@]}" \
            "$IMAGE:tmp-amd64" "$IMAGE:tmp-arm64"
          docker buildx imagetools inspect "$IMAGE:latest"

      - name: Delete temp per-arch tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          if [ "$(gh api "users/$owner" --jq .type)" = "Organization" ]; then
            base="/orgs/$owner"
          else
            base="/user"
          fi
          for arch in amd64 arm64; do
            gh api "$base/packages/container/omp-strix-sandbox/versions" --paginate \
              --jq ".[] | select(.metadata.container.tags[]? == \"tmp-$arch\") | .id" |
            while read -r id; do
              [ -n "$id" ] && gh api -X DELETE "$base/packages/container/omp-strix-sandbox/versions/$id"
            done
          done

      - name: Verify manifest children survived cleanup
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:latest" --raw |
            jq -r '.manifests[].digest' |
            while read -r d; do
              docker buildx imagetools inspect "$IMAGE@$d" --raw >/dev/null
              echo "child ${d:7:12} ok"
            done
